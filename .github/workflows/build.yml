name: build

# Builds Central Finite Curve for Windows and macOS.
# - On a version tag (vX.Y.Z) it attaches the packaged apps to the GitHub Release.
# - Can also be run manually (Actions -> build -> Run workflow) to get test artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # needed to attach files to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm mesh_monitor.spec

      - name: Package (Windows)
        if: matrix.name == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/CentralFiniteCurve/* -DestinationPath CentralFiniteCurve-windows.zip

      - name: Package (macOS)
        if: matrix.name == 'macos'
        run: |
          cd dist
          zip -ry ../CentralFiniteCurve-macos.zip CentralFiniteCurve.app
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CentralFiniteCurve-${{ matrix.name }}
          path: CentralFiniteCurve-${{ matrix.name }}.zip

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CentralFiniteCurve-${{ matrix.name }}.zip
          prerelease: true          # alpha
